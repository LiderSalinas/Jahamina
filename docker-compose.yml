services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly no
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jahamina-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.0.107:3000,http://192.168.1.20:3000}
      REDIS_URL: redis://redis:6379/0
      WS_TICKET_EXPIRE_SECONDS: ${WS_TICKET_EXPIRE_SECONDS:-60}
      CHAT_MAX_MESSAGE_LENGTH: ${CHAT_MAX_MESSAGE_LENGTH:-1000}
      CHAT_RATE_LIMIT_MESSAGES: ${CHAT_RATE_LIMIT_MESSAGES:-10}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-10}
      CHAT_TYPING_RATE_LIMIT_EVENTS: ${CHAT_TYPING_RATE_LIMIT_EVENTS:-8}
      CHAT_MAX_PAYLOAD_BYTES: ${CHAT_MAX_PAYLOAD_BYTES:-4096}
      CHAT_MAX_CONNECTIONS_PER_USER: ${CHAT_MAX_CONNECTIONS_PER_USER:-3}
      GEOCODING_PROVIDER_URL: ${GEOCODING_PROVIDER_URL:-https://nominatim.openstreetmap.org}
      ROUTING_PROVIDER_URL: ${ROUTING_PROVIDER_URL:-https://router.project-osrm.org}
      GEOCODING_API_KEY: ${GEOCODING_API_KEY:-}
      ROUTING_API_KEY: ${ROUTING_API_KEY:-}
      MAP_REQUEST_TIMEOUT_SECONDS: ${MAP_REQUEST_TIMEOUT_SECONDS:-5}
      MAP_CACHE_TTL_SECONDS: ${MAP_CACHE_TTL_SECONDS:-3600}
      LOCATION_UPDATE_INTERVAL_SECONDS: ${LOCATION_UPDATE_INTERVAL_SECONDS:-4}
      LOCATION_STALE_AFTER_SECONDS: ${LOCATION_STALE_AFTER_SECONDS:-20}
      LOCATION_MAX_ACCURACY_METERS: ${LOCATION_MAX_ACCURACY_METERS:-200}
      LOCATION_RATE_LIMIT_UPDATES: ${LOCATION_RATE_LIMIT_UPDATES:-5}
      LOCATION_RATE_LIMIT_WINDOW_SECONDS: ${LOCATION_RATE_LIMIT_WINDOW_SECONDS:-10}
      LOCATION_MAX_PAYLOAD_BYTES: ${LOCATION_MAX_PAYLOAD_BYTES:-4096}
      LOCATION_MAX_CONNECTIONS_PER_USER: ${LOCATION_MAX_CONNECTIONS_PER_USER:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
